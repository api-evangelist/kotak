  www.kotak.bank.in host answers every /.well-known/ path with HTTP 200 carrying
  an HTML "404 Page Not Found" body (a soft 404), so those are recorded as
  effective_status 404. Kotak DOES publish a real machine-readable API catalog,
  but at a non-standard path (https://api.kotak.bank.in/mapping/) rather than
  /.well-known/api-catalog. That document is harvested verbatim to
  kotak-api-catalog.json and is what the APICatalog pointer resolves to.
