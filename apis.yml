aid: kotak
name: Kotak Mahindra Bank
description: 'Kotak Mahindra Bank Limited is an Indian private-sector bank headquartered
  in Mumbai, and the first non-banking finance company in India to convert into a
  full commercial bank. Alongside retail, corporate, and NRI banking it operates the
  Kotak API Platform (api.kotak.com), an enterprise open-banking developer portal
  offering a curated stack of corporate banking APIs across six product categories
  — Account Services (balance enquiry, account statement), Payment Services (24x7
  NEFT/RTGS/IFT, CMS bulk payments, corporate IMPS remittance, name enquiry, UPI merchant
  cashback), Collection Services (UPI web collect and autopay, e-collection virtual
  accounts, NACH physical/e-mandate/Aadhaar e-mandate, BBPS agent and biller integration,
  direct debit queryback), Trade Finance (import/export letters of credit, standby
  LCs, bankers guarantees, collections, inward/outward remittance, shipping guarantee,
  document upload), Onboarding (application, dedupe, offers, OTP), and Authorization
  Services (OAuth 2.0 access tokens). The platform is aimed at fintechs, ERP providers,
  and NBFCs through its Connected Banking partner program, and pairs an integrated
  sandbox testing environment with per-product documentation and downloadable kits
  that are released after developer registration and login.'
